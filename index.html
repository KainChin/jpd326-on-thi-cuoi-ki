<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Ôn Thi Ngữ Pháp & Thi Nói N3 - Dekiru Nihongo Bài 6 - 10</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=4">
  <link rel="stylesheet" href="css/components.css?v=4">
  <link rel="stylesheet" href="css/millionaire.css?v=4">
</head>
<body>
  <div class="container">
    <header>
      <div class="brand-logo">
        <span>N3 Grammar Studio</span>
      </div>
      <nav class="nav-tabs">
        <button class="nav-tab-btn active" id="tab-btn-grammar" onclick="App.showView('grammar')">Công Thức</button>
        <button class="nav-tab-btn" id="tab-btn-situations" onclick="App.showView('situations')">Tình Huống</button>
        <button class="nav-tab-btn" id="tab-btn-speaking" onclick="App.showView('speaking')">10 Câu Hỏi</button>
      </nav>
    </header>

    <!-- VIEW 1: CÔNG THỨC -->
    <main id="view-grammar">
      <div class="search-filter-bar">
        <input type="text" id="search-input" class="search-input" placeholder="Tìm kiếm công thức, từ khóa, tiếng Việt..." oninput="App.handleSearch(this.value)">
      </div>
      <div class="lesson-bar" id="lesson-bar-grammar">
        <button class="lesson-btn active" onclick="App.filterLesson(6)">Bài 6</button>
        <button class="lesson-btn" onclick="App.filterLesson(7)">Bài 7</button>
        <button class="lesson-btn" onclick="App.filterLesson(8)">Bài 8</button>
        <button class="lesson-btn" onclick="App.filterLesson(9)">Bài 9</button>
        <button class="lesson-btn" onclick="App.filterLesson(10)">Bài 10</button>
      </div>
      <div id="grammar-list-root"></div>
    </main>

    <!-- VIEW 2: TÌNH HUỐNG -->
    <main id="view-situations" style="display: none;">
      <div id="situations-root"></div>
    </main>

    <!-- VIEW 3: 10 CÂU HỎI THI NÓI (FILTER BY LESSON) -->
    <main id="view-speaking" style="display: none;">
      <div class="lesson-bar" id="lesson-bar-speaking">
        <button class="lesson-btn active" onclick="App.filterSpeaking(6)">Bài 6</button>
        <button class="lesson-btn" onclick="App.filterSpeaking(7)">Bài 7</button>
        <button class="lesson-btn" onclick="App.filterSpeaking(8)">Bài 8</button>
        <button class="lesson-btn" onclick="App.filterSpeaking(9)">Bài 9</button>
        <button class="lesson-btn" onclick="App.filterSpeaking(10)">Bài 10</button>
      </div>
      <div id="speaking-root"></div>
    </main>

    <!-- VIEW 4: GAME AI LÀ TRIỆU PHÚ -->
    <main id="view-millionaire" style="display: none;">
      <div id="millionaire-root"></div>
    </main>
  </div>

  <!-- POP-UP MODAL ROOT -->
  <div id="modal-root"></div>

  <!-- SCROLL TO TOP BUTTON -->
  <button id="btn-scroll-top" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })" style="display: none; position: fixed; bottom: 25px; right: 25px; width: 48px; height: 48px; border-radius: 50%; background: #38bdf8; color: #0f172a; border: none; font-size: 1.4rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.4); z-index: 9999; transition: all 0.3s ease-in-out;">
    ↑
  </button>

  <!-- SCRIPTS -->
  <script src="js/data/lesson6_p1.js"></script><script src="js/data/lesson6_p2.js"></script><script src="js/data/lesson6_p3.js"></script>
  <script src="js/data/lesson7_p1.js"></script><script src="js/data/lesson7_p2.js"></script>
  <script src="js/data/lesson8_p1.js"></script><script src="js/data/lesson8_p2.js"></script>
  <script src="js/data/lesson9_p1.js"></script><script src="js/data/lesson9_p2.js"></script><script src="js/data/lesson9_p3.js"></script>
  <script src="js/data/lesson10_p1.js"></script><script src="js/data/lesson10_p2.js"></script><script src="js/data/lesson10_p3.js"></script>
  <script src="js/data/grammarStore.js"></script>
  <script src="js/data/situationsData.js"></script>
  <script src="js/data/speakingData.js?v=9"></script>
  <script src="js/quiz/quizLesson6.js"></script><script src="js/quiz/quizLesson7.js"></script><script src="js/quiz/quizLesson8.js"></script><script src="js/quiz/quizLesson9.js"></script><script src="js/quiz/quizLesson10.js"></script><script src="js/quiz/quizStore.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/millionaireGame.js"></script>
  <script src="js/bamen/bamen1.js?v=4"></script>
  <script src="js/bamen/bamen2.js?v=4"></script>
  <script src="js/bamen/bamen3.js?v=4"></script>
  <script src="js/bamen/bamen4.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
